name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU build & tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-

      - name: Install Python test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers tokenizers safetensors gguf

      - name: Check layering, numerics tables, and docs
        run: |
          python tools/check_layering.py
          python tools/check_numerics.py
          python tools/check_docs.py

      # The tests' fixtures take most of this job to make (make_assets) and change only with what make_tiny.py makes
      # them from: the Python reference, the converter, the chat templates and the packages installed above.  Its own
      # digest of those names the cache, and its stamp in the directory still decides on every run whether anything
      # is made again, so a cache it does not match is made over, never trusted.
      - name: Digest of what the test fixtures are made from
        id: fixtures
        run: echo "digest=$(python tests/e2e/make_tiny.py --digest)" >> "$GITHUB_OUTPUT"

      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: ~/flyx-build-cpu/assets
          key: fixtures-${{ runner.os }}-${{ steps.fixtures.outputs.digest }}

      - name: Build and test (cpu preset)
        run: bash tools/ci/cpu.sh

      - name: Upload CI log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-cpu-log
          path: logs/ci/cpu.log
