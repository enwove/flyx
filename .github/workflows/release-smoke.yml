name: Release smoke

# A published release's assets as a user downloads them, on machines without a GPU (tools/ci/README.md):
# every asset against SHA256SUMS.txt; the Linux tarball and wheel on clean containers of the distributions people run
# (the libraries and the GLIBC version they need, the version they say against the tag, the CLI, the CUDA backend
# refused without a GPU, a first token of the tiny model on cpu_ref, the server, pip install); the Windows executable,
# zip and wheel on a Windows runner.  A release published by a workflow
# with GITHUB_TOKEN starts no workflow: run this one by hand then (Actions, Release smoke, the tag).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the release's tag (v0.2.2)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  checksums:
    name: Every asset matches SHA256SUMS.txt
    runs-on: ubuntu-latest
    steps:
      - name: Download every asset
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D rel
      - name: Check them
        run: |
          cd rel
          ls -l
          sha256sum -c --strict SHA256SUMS.txt
          # And nothing published that the sums leave out.
          diff <(sed -E 's/^[0-9a-f]{64} [ *]//' SHA256SUMS.txt | tr -d '\r' | sort) \
               <(ls | grep -vx SHA256SUMS.txt | sort)

  # tiny.flyx, made by the release's own sources (their make_tiny.py and converter): a file of the format it reads.
  tiny-model:
    name: The tiny test model, from the release's sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: release-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: release-src/tests/requirements.txt
      - name: Install the release's test packages
        run: python -m pip install -r release-src/tests/requirements.txt
      - name: Make tiny.flyx
        run: python tools/ci/tiny_model.py release-src tiny
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-model
          path: tiny/tiny.flyx

  linux:
    name: Linux, ${{ matrix.image }}
    needs: tiny-model
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", name: ubuntu-22.04 }
          - { image: "ubuntu:24.04", name: ubuntu-24.04 }
          - { image: "ubuntu:26.04", name: ubuntu-26.04 }
          - { image: "debian:12", name: debian-12 }
          - { image: "debian:13", name: debian-13 }
          - { image: "fedora:latest", name: fedora-latest }
          - { image: "archlinux:latest", name: archlinux-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Download the tarball and the wheel, check their sums, unpack the tarball
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D rel -p '*-linux-x86_64-*.tar.gz' -p '*manylinux*.whl' \
            -p SHA256SUMS.txt
          cd rel
          sha256sum -c --ignore-missing SHA256SUMS.txt | tee checked.txt
          test "$(grep -c ': OK$' checked.txt)" -eq 2
          mkdir pkg && tar -C pkg -xzf ./*.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: tiny-model
          path: tiny
      # The container is the distribution as pulled: the script installs only its Python, after the checks of the
      # binaries alone.  No --gpus: no driver in it, as on the runner.
      - name: Smoke test in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" \
            bash tools/ci/release_smoke.sh rel/pkg/flyx-* rel/*.whl tiny/tiny.flyx "${{ matrix.name }}.tsv" "$TAG"
      - name: Summary
        if: ${{ !cancelled() && hashFiles(format('{0}.tsv', matrix.name)) != '' }}
        run: python3 tools/ci/release_smoke_report.py "${{ matrix.name }}.tsv" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-${{ matrix.name }}
          path: ${{ matrix.name }}.tsv
          if-no-files-found: ignore

  windows:
    name: Windows
    needs: tiny-model
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the executable, the zip and the wheel, check their sums
        shell: bash
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D rel -p '*-windows-x86_64-*' -p '*win_amd64.whl' \
            -p SHA256SUMS.txt
          cd rel
          sha256sum -c --ignore-missing SHA256SUMS.txt | tee checked.txt
          test "$(grep -c ': OK$' checked.txt)" -eq 3
      - uses: actions/download-artifact@v4
        with:
          name: tiny-model
          path: tiny
      - name: Smoke test
        run: |
          pwsh tools/ci/release_smoke_windows.ps1 -Exe (Resolve-Path rel/*.exe) -Zip (Resolve-Path rel/*.zip) `
            -Wheel (Resolve-Path rel/*.whl) -Model tiny/tiny.flyx -Results windows.tsv -Tag $env:TAG
      - name: Summary
        if: ${{ !cancelled() && hashFiles('windows.tsv') != '' }}
        run: python tools/ci/release_smoke_report.py windows.tsv >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-windows
          path: windows.tsv
          if-no-files-found: ignore

  report:
    name: Every platform
    needs: [checksums, linux, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          merge-multiple: true
          path: results
      - name: One table
        run: |
          echo "## ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci/release_smoke_report.py results/*.tsv | tee -a "$GITHUB_STEP_SUMMARY"
