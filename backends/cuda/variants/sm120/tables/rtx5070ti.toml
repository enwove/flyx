# Tuning table for NVIDIA GeForce RTX 5070 Ti, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-21, RTX 5070 Ti 16 GB, driver 610.88, CUDA 13.0 (`cuda_bench tune gemm,blocks,blocks_q8,blocks_round` with PDL).
# Verified on Qwen3.8-27B UD-IQ3_XXS (MTP, no lookup): plain +4.4%, dynamic +4..19%, w7 +10..21%, 6K prefill +1.5%.
sku = "rtx5070ti"
devices = ["NVIDIA GeForce RTX 5070 Ti"]
# Programmatic dependent launch verified on Qwen3.8-27B UD-IQ3_XXS (3x interleaved code dynamic: 193.8 -> 198.6 tok/s, +2.5%).
pdl = true

# cuda_bench tune strata_placement (309K host-copy decode).
[[strata_placement]]
copies = 16
host = 12
bits = 2
nkv = 4
hd = 256
min_capacity = 311296
edge_host = 2
scan_halves = true

# cuda_bench tune flash_gqa
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 6

[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 1024
keys = 32832
hb = 2

