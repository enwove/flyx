# Tuning table for NVIDIA GeForce RTX 5070 Ti, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-21, RTX 5070 Ti 16 GB, driver 610.88, CUDA 13.0 (`cuda_bench tune gemm,blocks,blocks_q8,blocks_round` with PDL).
# Verified on Qwen3.8-27B UD-IQ3_XXS (MTP, no lookup): plain +4.4%, dynamic +4..19%, w7 +10..21%, 6K prefill +1.5%.
# 2026-11-26, the same GPU, driver 610.88, CUDA 13.0.88, flyx 5fae786, `cuda_bench tune` (every family, no file):
# the rounds (blocks_round), 8-bit passes (blocks_q8) and their runs of K (blocks_q8_runs, the defaults' before),
# and the bf16 GEMMs of 17..64 rows (bf16_rows, bf16_draft) this table lacked; its other rules are kept.
# Against the table before (`flyx bench --prompts`, --ctx 4096 --kv-method exact, --backend-opt tuning= in turns,
# Windows): Qwen3.8-27B-UD-IQ3_XXS plain +0.0%, MTP +1.1%, prefill of short prompts 6.5% faster, of a 6K prompt
# 0.8% slower; Qwen3.5-4B-Q4_K_M plain +3.8%, short prompts' prefill 2.1% faster; Inkling-2-Mini-UD-IQ3_XXS plain
# and DSpark within 0.3%.  The same tokens but where the new runs of K (a K partition) round the 27B's sums otherwise.
sku = "rtx5070ti"
devices = ["NVIDIA GeForce RTX 5070 Ti"]
# Programmatic dependent launch verified on Qwen3.8-27B UD-IQ3_XXS (3x interleaved code dynamic: 193.8 -> 198.6 tok/s, +2.5%).
pdl = true

# cuda_bench tune strata_placement (309K host-copy decode).
[[strata_placement]]
copies = 16
host = 12
bits = 2
nkv = 4
hd = 256
min_capacity = 311296
edge_host = 2
scan_halves = true

# cuda_bench tune flash_gqa
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 6

[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 1024
keys = 32832
hb = 2

