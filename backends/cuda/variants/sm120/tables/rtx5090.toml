bf16 = [
  { rows = [1, 1], nt = 1, warps = 16, unroll = 16 },
  { rows = [2, 4], nt = 1, warps = 16, unroll = 8 },
  { rows = [5, 8], nt = 1, warps = 16, unroll = 4 },
  { rows = [9, 16], nt = 2, warps = 16, unroll = 4 },
]
nvfp4_k128 = { span = 128, chunks = 8, nt = 1, warps = 8, unroll = 4 }
nvfp4_k64 = { span = 64, chunks = 16, nt = 1, warps = 16, unroll = 4 }
blocks = [
  { n_max = 2048, rows = [1, 16], nt = 1, nw = 2, kw = 4 },
  { n_max = 6144, rows = [1, 2], nt = 1, nw = 2, kw = 4 },
  { n_max = 6144, rows = [3, 16], nt = 1, nw = 4, kw = 4 },
