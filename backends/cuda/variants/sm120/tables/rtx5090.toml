# Tuning table for NVIDIA GeForce RTX 5090, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-12..15, RTX 5090 32 GB, CUDA 13 (verified end-to-end on Qwen3.8-27B).
sku = "rtx5090"
devices = ["NVIDIA GeForce RTX 5090"]
# Programmatic dependent launch verified on Qwen3.8-27B UD-Q4_K_XL (+0.9% plain, +2.3% MTP, +0.3% DFlash2).
pdl = true
# The table of every sm_120 GPU without one of its own: on an RTX PRO 6000 Blackwell (QUASAR's NVFP4
# 27B) plain decoding 66.5 -> 77.7 tok/s and DFlash2 229 -> 258 against the defaults (docs/perf/2026-11-20-modal-tables.md).
architectures = ["12.0"]

[[gemm]]  # attention q|k|v
format = "nvfp4"
n = 10240
k = 2560
rules = [
  { rows = [1, 1], span = 128, chunks = 4, nt = 1, warps = 2, unroll = 4 },  # r1 1286
  { rows = [2, 8], span = 128, chunks = 4, nt = 1, warps = 4, unroll = 4 },  # r4 1266 r8 1234
  { rows = [9, 16], span = 128, chunks = 4, nt = 2, warps = 4, unroll = 4 },  # r16 1190
]

