# This GPU's rules: for shapes no [[gemm]] lists, and the GGML block kernels' on Qwen3.8-27B's and Qwen3.5-4B's layers, every block type.
[rules]
bf16 = [
  { rows = [1, 8], nt = 1, warps = 16, unroll = 8 },
  { rows = [9, 16], nt = 2, warps = 16, unroll = 4 },
]
nvfp4_k128 = { span = 128, chunks = 8, nt = 2, warps = 8, unroll = 4 }
nvfp4_k64 = { span = 64, chunks = 16, nt = 1, warps = 16, unroll = 4 }
bf16_rows = [
  { rows = [17, 32], nt = 4, chunks = 16, unroll = 4, parts = 3 },
  { rows = [33, 64], nt = 4, chunks = 16, unroll = 2, parts = 3 },
]
bf16_draft = [
  { rows = [17, 64], nt = 2, unroll = 4 },
]
blocks = [
  { n_max = 2048, rows = [1, 16], nt = 1, nw = 2, kw = 4 },
  { n_max = 5120, rows = [1, 1], nt = 1, nw = 4, kw = 2 },
  { n_max = 5120, rows = [2, 2], nt = 1, nw = 4, kw = 4 },
  { n_max = 5120, rows = [3, 16], nt = 1, nw = 4, kw = 2 },
  { n_max = 6144, rows = [1, 2], nt = 1, nw = 2, kw = 4 },
  { n_max = 6144, rows = [3, 4], nt = 1, nw = 4, kw = 2 },
  { n_max = 6144, rows = [5, 16], nt = 1, nw = 4, kw = 4 },
  { n_max = 12288, rows = [1, 16], nt = 1, nw = 8, kw = 1 },
  { n_max = 65536, rows = [1, 4], nt = 1, nw = 4, kw = 2 },
