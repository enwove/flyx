# Tuning table for NVIDIA GeForce RTX 5080, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-14, RTX 5080 16 GB, driver 580.126.09, power limit 330 W: the round rules (blocks_round) and moe_gate_up, kept.
# 2026-11-26, RTX 5080 16 GB (vast.ai, power limit 360 W), driver 615.71.09, CUDA 13.0.88, flyx 5fae786,
# `cuda_bench tune` (every family, no file): the [[gemm]] shapes, [[flash_gqa]] and the families bf16, nvfp4,
# bf16_rows, bf16_draft and blocks this table lacked (the defaults before), and programmatic dependent launch.
# 8-bit passes stay the defaults' (this GPU's own and their runs of K slowed Qwen3.5-4B's prefill 1-3%), and the
# tuner's rounds and moe_gate_up were no faster than these.  Against the table before (`flyx bench --prompts`,
# --ctx 4096 --kv-method exact, in turns; the same tokens in every run): Qwen3.8-27B-UD-IQ3_XXS plain +3.8%, MTP
# +1.7%; Qwen3.5-4B-Q4_K_M plain +4.0%; Inkling-2-Mini-UD-IQ3_XXS plain +1.3%, with DSpark +0.9%; prefill
# unchanged.  Most of it is pdl (the old table with pdl=1 alone: 27B plain +3.7%, 4B plain +4.0%).
sku = "rtx5080"
devices = ["NVIDIA GeForce RTX 5080"]
pdl = true

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 3.9246 3.9379 3.9363 3.9358 3.9313 3.9348 median 3.9353
# HB3 3.8734 3.8722 3.8726 3.8726 3.8742 3.8722 median 3.8726
# HB6 4.0452 4.0505 4.0509 4.0452 4.0448 4.0489 median 4.0471
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 3

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 10.8806 10.8954 10.8470 10.8577 10.8339 10.8089 median 10.8524
# HB3 14.5506 14.5390 14.5357 14.5316 14.5699 14.5582 median 14.5448
# HB6 16.0948 16.0989 16.1038 16.0956 16.0989 16.0948 median 16.0973
