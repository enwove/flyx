# Tuning table for NVIDIA GeForce RTX 5070, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-26, RTX 5070 12 GB (vast.ai, power limit 250 W), driver 615.71.09, CUDA 13.0.88, flyx 5fae786,
# `cuda_bench tune` (every family, no file), on the RTX 5090's table (the sm_120 table it ran before): this GPU's
# own 8-bit passes (blocks_q8) and the families the A/B below does not reach; the 5090's rounds and runs of K
# stay (this GPU's own rounds were 3% slower in decoding, its runs slowed short prompts' prefill 1.6%).
# Against the RTX 5090 table (`flyx bench --prompts`, --ctx 4096 --kv-method exact, --backend-opt tuning=rtx5090
# and this table in turns; the same tokens in every run), Qwen3.5-4B-Q4_K_M: plain decoding +0.0%, prefill of
# short prompts 0.2% and of a 6K prompt 8.1% faster (larger models do not fit 12 GB).
sku = "rtx5070"
devices = ["NVIDIA GeForce RTX 5070"]
inherit = "rtx5090"

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 3.8955 3.9004 3.9049 3.9209 3.9062 3.9229 median 3.9055
# HB3 6.8201 6.8258 6.8446 6.8418 6.8372 6.8434 median 6.8395
# HB6 8.0013 8.0218 8.0349 8.0377 8.0337 8.0501 median 8.0343
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 2

