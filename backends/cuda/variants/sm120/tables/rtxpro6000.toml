rules = [
  { rows = [1, 1], nt = 1, warps = 8, unroll = 8 },  # r1 1365
  { rows = [2, 16], nt = 4, warps = 16, unroll = 4 },  # r4 1290 r8 1277 r16 1258
]

[[gemm]]  # qwen3.8-27b / its eagle4 drafter, bf16 32768x5120
