rules = [
  { rows = [17, 64], nt = 4, chunks = 16, unroll = 2, parts = 3 },  # r32 1275 r48 1194 r64 919 (1043 785 613)
]

[[gemm]]  # qwen3.8-27b attention q|k|v|gate, 17..64 rows
format = "bf16_rows"
n = 14336
