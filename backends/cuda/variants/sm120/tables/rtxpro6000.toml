n = 5120
k = 6144
rules = [
  { rows = [1, 1], nt = 1, warps = 8, unroll = 8 },  # r1 1368
  { rows = [2, 4], nt = 2, warps = 8, unroll = 8 },  # r4 1283
  { rows = [5, 16], nt = 4, warps = 16, unroll = 4 },  # r8 1272 r16 1251
]

[[gemm]]  # qwen3.8-27b / its eagle4 drafter, bf16 15360x10240
