  { rows = [1, 4], nt = 1, warps = 16, unroll = 4 },  # r1 1511 r4 1474
  { rows = [5, 16], nt = 4, warps = 16, unroll = 4 },  # r8 1409 r16 1406
]

[[gemm]]  # qwen3.8-27b / its eagle4 drafter, bf16 5120x16384
format = "bf16"
n = 5120
k = 16384
rules = [
  { rows = [1, 8], nt = 4, warps = 16, unroll = 4 },  # r1 1477 r4 1467 r8 1449
  { rows = [9, 16], nt = 4, warps = 4, unroll = 4, split = 4 },  # r16 1370 (one block a tile: 1244)
]

[[gemm]]  # qwen3.8-27b / its eagle4 drafter, bf16 5120x15360
format = "bf16"
n = 5120
k = 15360
rules = [
  { rows = [1, 8], nt = 4, warps = 16, unroll = 4 },  # r1 1408 r4 1398 r8 1380
  { rows = [9, 16], nt = 4, warps = 4, unroll = 4, split = 4 },  # r16 1337 (one block a tile: 1233)
]

[[gemm]]  # qwen3.8-27b gate|up, 17..64 rows (in brackets below: the inherited RTX 5090 rules' GB/s)
format = "bf16_rows"
n = 34816
k = 5120
rules = [
  { rows = [17, 64], nt = 4, chunks = 16, unroll = 2, parts = 3 },  # r32 1319 r48 1257 r64 1009 (1138 876 696)
]

[[gemm]]  # qwen3.8-27b mlp down, 17..64 rows
format = "bf16_rows"
n = 5120
k = 17408
rules = [
  { rows = [17, 64], nt = 4, chunks = 16, unroll = 2, parts = 3 },  # r32 1166 r48 1071 r64 969 (1140 828 663)
]

[[gemm]]  # qwen3.8-27b GDN in, 17..64 rows
format = "bf16_rows"
n = 16480
