n = 15360
k = 10240
rules = [
  { rows = [1, 4], nt = 1, warps = 16, unroll = 4 },  # r1 1493 r4 1412
  { rows = [5, 16], nt = 4, warps = 16, unroll = 4 },  # r8 1381 r16 1306
]

[[gemm]]  # qwen3.8-27b / its eagle4 drafter, bf16 5120x5120
