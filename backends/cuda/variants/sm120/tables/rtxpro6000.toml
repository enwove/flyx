# Tuning table for NVIDIA RTX PRO 6000 Blackwell Server Edition, written by `cuda_bench tune gemm 6144x4096 4096x4096
# 24576x4096 4096x12288` (GB/s of weights streamed in brackets): Qwen3-8B's bf16 GEMMs as the engine runs them
# (q|k|v, attention out, mlp gate|up, mlp down), and, below, moe_gate_up and a blocks_q8 rule from gpt-oss-20b; every
# other shape and family the RTX 5090's.
# 2026-11-25, RTX PRO 6000 Blackwell Server Edition 96 GB, 600 W, driver 620.70.06, CUDA 13.4.
# Verified on Qwen3-8B (BF16) with DSpine at 15 drafts (docs/benchmarks.md section 6, the same answers): GSM8K 617.6 to
# 642.6 tok/s, HumanEval 490.8 to 505.0 against the RTX 5090's table.
sku = "rtxpro6000"
devices = ["NVIDIA RTX PRO 6000 Blackwell Server Edition"]
inherit = "rtx5090"

[[gemm]]  # qwen3-8b attention q|k|v
format = "bf16"
n = 6144
k = 4096
rules = [
  { rows = [1, 4], nt = 1, warps = 16, unroll = 8 },  # r1 1402 r4 1354
  { rows = [5, 8], nt = 1, warps = 16, unroll = 16 },  # r8 1251
  { rows = [9, 16], nt = 2, warps = 16, unroll = 8 },  # r16 1100
]

[[gemm]]  # qwen3-8b attention out
format = "bf16"
n = 4096
k = 4096
rules = [
  { rows = [1, 1], nt = 1, warps = 16, unroll = 16 },  # r1 1340
  { rows = [2, 16], nt = 4, warps = 16, unroll = 4 },  # r4 1306 r8 1295 r16 1255
]

[[gemm]]  # qwen3-8b mlp gate|up
format = "bf16"
n = 24576
k = 4096
rules = [
  { rows = [1, 4], nt = 1, warps = 16, unroll = 4 },  # r1 1505 r4 1420
  { rows = [5, 8], nt = 4, warps = 16, unroll = 4 },  # r8 1391
  { rows = [9, 16], nt = 2, warps = 16, unroll = 8 },  # r16 1372
]

[[gemm]]  # qwen3-8b mlp down
format = "bf16"
n = 4096
k = 12288
rules = [
  { rows = [1, 1], nt = 1, warps = 16, unroll = 8 },  # r1 1032
  { rows = [2, 4], nt = 2, warps = 16, unroll = 8 },  # r4 1023
  { rows = [5, 8], nt = 1, warps = 16, unroll = 16 },  # r8 1040
  { rows = [9, 16], nt = 4, warps = 16, unroll = 4 },  # r16 1008
]

[rules]
# MoE layers' fused gate|up GEMMs: `cuda_bench tune moe_gate_up gpt-oss-20b-MXFP4.gguf` on this GPU (2026-11-27, driver
# 620.70.06), its gate and up experts as the engine stacks them (32 x 5760 x 2880), against the original tiles:
# moe_gate_up, passes of 1 rows: 681 us with these rules, 716 with the defaults (-4.9%), 681 with the best for each
# moe_gate_up, passes of 2 rows: 1021 us with these rules, 1074 with the defaults (-4.9%), 1021 with the best for each
# moe_gate_up, passes of 4 rows: 1623 us with these rules, 1676 with the defaults (-3.2%), 1623 with the best for each
# moe_gate_up, passes of 6 rows: 2430 us with these rules, 2430 with the defaults (+0.0%), 2385 with the best for each
# moe_gate_up, passes of 8 rows: 2811 us with these rules, 2811 with the defaults (+0.0%), 2750 with the best for each
# The other types' rules are the RTX 5090's (a family here takes the place of the parent's).
moe_gate_up = [
  { types = ["MXFP4"], rows = [1, 4], columns = 1, units = 1 },
  { types = ["MXFP4"], columns = 0, units = 0 },
  { types = ["IQ2_XXS", "IQ2_S"], rows = [1, 2], columns = 1, units = 1 },
  { types = ["IQ2_XXS", "IQ2_S"], columns = 2, units = 1 },
  { types = ["IQ2_XS"], rows = [1, 4], columns = 1, units = 1 },
  { types = ["IQ2_XS"], columns = 2, units = 1 },
  { types = ["IQ3_XXS"], columns = 1, units = 1 },
  { columns = 0, units = 0 },
]
# Passes of more than 16 rows in 8 bits: the RTX 5090's rules, and Q8_0 matrices of more than 2048 columns in passes of
# 129-512 rows in tiles of 64 rows, 128 columns (the 5090's tuner measured long passes at 512 rows only, where tiles of
# 128 rows win): gpt-oss-20b's q|k|v (5120 x 2880) and out (2880 x 4096) at 145 rows 63 -> 45 and 69 -> 40 us
# (`flyx bench`, a 145-token prompt's pass under bench/trace).
blocks_q8 = [
  { types = ["Q4_1"], rows = [17, 128], n_max = 12288, bn = 64, qk = 128, bm = 64 },
  { types = ["Q4_1"], rows = [17, 128], bn = 128, qk = 256, bm = 64 },
  { types = ["Q4_1"], rows = [129, 2147483647], n_max = 2048, bn = 64, qk = 128, bm = 64 },
  { types = ["Q4_1"], bn = 128, qk = 64, bm = 128 },
  { types = ["Q5_1"], rows = [17, 128], n_max = 12288, bn = 64, qk = 128, bm = 64 },
  { types = ["Q5_1"], rows = [17, 128], bn = 128, qk = 256, bm = 64 },
  { types = ["Q5_1"], rows = [129, 2147483647], n_max = 64, bn = 64, qk = 128, bm = 64 },
  { types = ["Q5_1"], bn = 128, qk = 64, bm = 128 },
  { types = ["Q8_0"], rows = [17, 128], n_max = 2048, bn = 64, qk = 128, bm = 64 },
  { types = ["Q8_0"], rows = [17, 128], bn = 128, qk = 256, bm = 64 },
  { types = ["Q8_0"], rows = [129, 2147483647], n_max = 64, bn = 64, qk = 128, bm = 64 },
  { types = ["Q8_0"], rows = [129, 2147483647], n_max = 2048, bn = 128, qk = 256, bm = 64 },
  { types = ["Q8_0"], rows = [129, 512], bn = 128, qk = 256, bm = 64 },  # this GPU's: see above
  { types = ["Q8_0"], bn = 128, qk = 64, bm = 128 },
  { types = ["IQ2_XXS", "IQ3_XXS", "IQ3_S", "IQ1_S"], rows = [17, 128], n_max = 2048, bn = 64, qk = 128, bm = 64 },
  { types = ["IQ2_XXS", "IQ3_XXS", "IQ3_S", "IQ1_S"], rows = [17, 128], n_max = 6144, bn = 128, qk = 256, bm = 64 },
  { types = ["IQ2_XXS", "IQ3_XXS", "IQ3_S", "IQ1_S"], rows = [17, 128], n_max = 12288, bn = 64, qk = 128, bm = 64 },
  { types = ["IQ2_XXS", "IQ3_XXS", "IQ3_S", "IQ1_S"], rows = [17, 128], bn = 128, qk = 256, bm = 64 },
  { types = ["IQ2_XXS", "IQ3_XXS", "IQ3_S", "IQ1_S"], rows = [129, 2147483647], n_max = 64, bn = 64, qk = 128, bm = 64 },
  { types = ["IQ2_XXS", "IQ3_XXS", "IQ3_S", "IQ1_S"], rows = [129, 2147483647], n_max = 2048, bn = 128, qk = 256, bm = 64 },
  { types = ["IQ2_XXS", "IQ3_XXS", "IQ3_S", "IQ1_S"], rows = [129, 2147483647], n_max = 65536, bn = 128, qk = 256, bm = 128 },
  { types = ["IQ2_XXS", "IQ3_XXS", "IQ3_S", "IQ1_S"], bn = 128, qk = 64, bm = 128 },
  { types = ["IQ2_S", "IQ1_M"], rows = [17, 128], n_max = 12288, bn = 64, qk = 128, bm = 64 },
  { types = ["IQ2_S", "IQ1_M"], rows = [17, 128], bn = 128, qk = 256, bm = 64 },
  { types = ["IQ2_S", "IQ1_M"], rows = [129, 2147483647], n_max = 2048, bn = 64, qk = 128, bm = 64 },
  { types = ["IQ2_S", "IQ1_M"], rows = [129, 2147483647], n_max = 65536, bn = 128, qk = 256, bm = 128 },
  { types = ["IQ2_S", "IQ1_M"], bn = 128, qk = 64, bm = 128 },
  { rows = [17, 128], n_max = 2048, bn = 64, qk = 128, bm = 64 },
  { rows = [17, 128], n_max = 6144, bn = 128, qk = 256, bm = 64 },
  { rows = [17, 128], n_max = 12288, bn = 64, qk = 128, bm = 64 },
  { rows = [17, 128], bn = 128, qk = 256, bm = 64 },
  { rows = [129, 2147483647], n_max = 2048, bn = 64, qk = 128, bm = 64 },
  { bn = 128, qk = 64, bm = 128 },
]
