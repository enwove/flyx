# Tuning table for NVIDIA RTX PRO 6000 Blackwell Workstation Edition, written by `cuda_bench tune gemm 34816x5120
# 5120x17408 16480x5120 14336x5120 5120x6144 15360x10240 5120x5120 32768x5120 5120x16384 5120x15360` (GB/s of weights
# streamed in brackets): Qwen3.8-27B's bf16 GEMMs as the engine runs them (mlp gate|up and down, the gated delta net's
# in-projection, attention q|k|v|gate, both layers' out-projections) and its EAGLE-4 drafter's (q|k|v over the pair,
# o, gate|up, down, fc over the taps); every other shape and family the Server Edition's.
# 2026-11-27, RTX PRO 6000 Blackwell Workstation Edition 96 GB, 600 W, driver 615.71.09, CUDA 13.0.
sku = "rtxpro6000ws"
devices = ["NVIDIA RTX PRO 6000 Blackwell Workstation Edition"]
inherit = "rtxpro6000"

[[gemm]]  # bf16 34816x5120
format = "bf16"
n = 34816
k = 5120
rules = [
  { rows = [1, 4], nt = 1, warps = 16, unroll = 4 },  # r1 1623 r4 1603
  { rows = [5, 8], nt = 4, warps = 16, unroll = 4 },  # r8 1571
  { rows = [9, 16], nt = 4, warps = 8, unroll = 4 },  # r16 1541
]

[[gemm]]  # bf16 5120x17408
format = "bf16"
n = 5120
k = 17408
rules = [
  { rows = [1, 8], nt = 4, warps = 16, unroll = 4 },  # r1 1554 r4 1546 r8 1514
  { rows = [9, 16], nt = 2, warps = 16, unroll = 8 },  # r16 1451
]

