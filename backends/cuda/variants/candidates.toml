# else 64 x 128.  From cuda_bench tc on the RTX 5070 Ti (Qwen3.5-4B shapes, 32-2048 rows): within 5% of the best of
# the first four configurations on every shape and row count, and on 2560-column weights up to 1.7x the 64 x 128 tile
# at 32-64 rows.
prefill_tc = [
  { sm_tiles_below = 0.5, bm = 64, bn = 32, wn = 2, stages = 2 },
  { format = "nvfp4", sm_tiles_below = 6, bm = 64, bn = 64, wn = 4, stages = 2 },
  { format = "bf16", sm_tiles_below = 2.5, bm = 64, bn = 64, wn = 4, stages = 2 },
  { bm = 64, bn = 128, wn = 4, stages = 2 },
]
