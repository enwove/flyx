# MoE layers' fused gate|up GEMMs on dp4a (a moe_dp4a configuration; their down GEMMs and unfused projections take
# the original tiles): the first rule that matches the block type and the pass's rows.  Rules naming types come
# first; each list of types, and the rules for every other type, ends with a rule for the rest (no rows), and only
# the original tiles serve every type.  Defaults stay conservative (original tiles everywhere); per-GPU rules tuned
# by `cuda_bench tune moe_gate_up` belong under variants/<arch>/tables/<sku>.toml.
moe_gate_up = [
  { columns = 0, units = 0 },
