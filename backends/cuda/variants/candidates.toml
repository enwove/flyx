  { types = ["IQ3_S"], rows = [3, 4], n_max = 6144, columns = 1, ahead = 0 },
  { types = ["Q4_0", "Q4_1", "Q5_1", "IQ4_NL"], rows = [3, 4], n_min = 2048, n_max = 6144, columns = 4, ahead = 0 },
  { types = ["Q3_K"], rows = [3, 4], n_min = 2048, n_max = 65536, columns = 2, ahead = 0 },
