# GGML block weights, rounds with inputs in 8 bits on dp4a (k_round_blocks_q8): the rows the kernel holds (1, 2, 4,
# 8 or 16; a round runs one that takes its rows), the columns a warp takes at once (a row's values are loaded once
# for all of them) and the groups of 32 weights a lane loads ahead per column (on their way while it multiplies);
# 0 takes them by the type's unit: 4 columns (2 for units over 32 bytes), as many groups ahead as registers hold 4
# units of 16 bytes or 2 of more; `warps` a block of threads (8 unless said); `staged`: the block first copies the
# round's rows (their 8-bit values, scales and sums) to shared memory and reads them there (where they do not fit,
# K too long, the same configuration reads them from global memory).  Every one gives the same bits.  The ones the
# defaults use (`cuda_bench rounds` measures every one compiled); the staged ones, 2..8 rows on wide layers:
#
[[blocks_round]]
