#
# Kernel configurations compiled into the CUDA backend, and [defaults]: the
# rules every GPU without a table of its own takes.  The tuner (`cuda_bench
# tune`) measures every one of them on the model's shapes; the per-GPU tables
# in variants/<arch>/tables/ pick among them per shape and row count, and may
# carry their own rules of any family [defaults] has ([rules]: a family whole);
# tools/codegen/gen_gemm_tables.py turns all of it into C++ at build time.
#
# Every bf16 configuration gives bit-identical results.  NVFP4 results depend
# on the K partition (span, chunks): a table must use one partition for all
# row counts of a shape.

[[bf16_skinny]]            # tile (8-column groups per warp), warps per block, loop unroll
nt = 1
warps = 8
unroll = 8
[[bf16_skinny]]
nt = 1
warps = 16
unroll = 8
[[bf16_skinny]]
