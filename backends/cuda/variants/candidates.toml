# MoE layers' packed expert GEMMs with inputs in 8 bits on dp4a (k_moe_blocks_q8_dp4a: rounds, and passes of fewer
# rows than its MMA kernel takes): the output columns a warp takes (gate/up pairs where the activation is fused) and
# the K/32 units a lane has in flight.  `columns = 0, units = 0`: the original tiles (one pair a warp fused, two
# columns otherwise; two units at one row where a unit is 32 bytes or less, one otherwise), the configuration every
# block type compiles; the others, for the types gen_gemm_tables.py's MOE_DP4A_TYPES names, load only the tables
# their units decode with and run a grouped tile of one row through the one-row loop.  Every one gives the same bits.
[[moe_dp4a]]
columns = 0
units = 0
[[moe_dp4a]]
columns = 1
units = 1
[[moe_dp4a]]
columns = 1
units = 2
[[moe_dp4a]]
columns = 2
units = 1
[[moe_dp4a]]
columns = 2
units = 2
[[moe_dp4a]]
columns = 4
units = 1
[[moe_dp4a]]
columns = 4
units = 2

# Prefill GEMMs on the bf16 tensor cores (k_gemm_tc, more than 16 rows): block tile rows (bm, 64 a warp) and
# columns (bn), warps along the columns (wn), pipeline stages.  Every one gives the same bits: each output is the
# same sum in the same order.  64 x 128 of 2 stages takes 24 KB of shared memory (NVFP4 less), four blocks an SM;
# 64 x 64 and 64 x 32 suit a pass whose 64 x 128 tiles leave SMs idle; deeper pipelines one of few rows, whose
# blocks each stream their weight columns over K with little compute between the loads.
[[prefill_tc]]
bm = 64
bn = 128
wn = 4
stages = 2
[[prefill_tc]]
