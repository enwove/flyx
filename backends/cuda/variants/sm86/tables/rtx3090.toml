# Tuning table for NVIDIA GeForce RTX 3090, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-26, RTX 3090 24 GB (vast.ai, power limit 300 W), driver 595.99.02, CUDA 13.0.88, flyx 5fae786,
# `cuda_bench tune` (every family, no file).  Passes of 8-bit inputs (blocks_q8, blocks_q8_runs) stay the RTX
# 3080's (inherited, the same GA102 chip): this GPU's own made short prompts' prefill 1-13% slower.
# Against the RTX 3080 table it ran before (`flyx bench --prompts`, --ctx 4096 --kv-method exact, --backend-opt
# tuning=rtx3080 and this table in turns; the same tokens in every run): Qwen3.8-27B-UD-IQ3_XXS plain +0.7%, MTP
# +0.5%, 6K prefill 0.0%; Qwen3.5-4B-Q4_K_M plain -0.3%, prefill of short prompts 2.7% faster;
# Inkling-2-Mini-UD-IQ3_XXS plain +0.3%, with DSpark +0.9%.
sku = "rtx3090"
devices = ["NVIDIA GeForce RTX 3090"]
inherit = "rtx3080"

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 7.9032 8.3161 8.3767 8.2524 8.3759 8.4150 median 8.3460
# HB3 7.6299 7.5817 7.6628 7.5700 7.9880 7.6528 median 7.6413
# HB6 7.1127 7.2190 7.2020 7.2090 7.2831 7.3376 median 7.2140
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 6

