  { rows = [17, 32], nt = 4, chunks = 16, unroll = 4, parts = 3 },
  { rows = [33, 48], nt = 4, chunks = 16, unroll = 2, parts = 3 },
  { rows = [49, 64], nt = 4, chunks = 16, unroll = 4, parts = 3 },
]
