# Tuning table for NVIDIA GeForce RTX 3060, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-26, RTX 3060 12 GB (vast.ai, power limit 170 W), driver 580.126.20, CUDA 13.0.88, flyx 5fae786,
# `cuda_bench tune` (every family, no file), on the RTX 3080's table (the sm_86 table it ran before): the families
# the A/B below does not reach.  Rounds and 8-bit passes stay the 3080's: this GPU's own rounds were 0.8% slower
# in decoding, its tiles and runs of K slowed short prompts' prefill 3-4% (6K prompts 4-6% faster).  Against the
# RTX 3080 table (`flyx bench --prompts`, --ctx 4096 --kv-method exact, in turns; the same tokens in every run),
# Qwen3.5-4B-Q4_K_M: plain decoding and prefill within 0.3% (larger models do not fit 12 GB).
sku = "rtx3060"
devices = ["NVIDIA GeForce RTX 3060"]
inherit = "rtx3080"

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 15.5943 14.4834 14.5265 14.5265 14.5275 14.5273 median 14.5269
# HB3 20.1351 19.9936 19.9924 19.9875 19.9912 19.9948 median 19.9930
# HB6 18.8879 19.0409 19.0423 19.0364 19.0241 19.0398 median 19.0381
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 2

