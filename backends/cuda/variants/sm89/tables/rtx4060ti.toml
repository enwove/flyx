# Tuning table for NVIDIA GeForce RTX 4060 Ti, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-26, RTX 4060 Ti 16 GB (vast.ai, power limit 165 W), driver 595.99.02, CUDA 13.0.88, flyx 5fae786,
# `cuda_bench tune` (every family, no file), on the RTX 4080 SUPER's table (the sm_89 table it ran before): this
# GPU's own 8-bit passes (blocks_q8) and the families the A/B below does not reach; the 4080 SUPER's rounds and runs
# of K stay (this GPU's own rounds were no faster, its runs slowed the 27B's short prompts 1.3%).  Against the RTX
# 4080 SUPER table (`flyx bench --prompts`, --ctx 4096 --kv-method exact, in turns; the same tokens in every run):
# Qwen3.8-27B-UD-IQ3_XXS plain and MTP +0.0%, prefill of short prompts 1.4% and of a 6K prompt 0.4% faster;
# Qwen3.5-4B-Q4_K_M plain +0.0%, prefill 2.0% (short) and 3.4% (6K) faster; Inkling-2-Mini-UD-IQ3_XXS plain
# +0.0%, with DSpark +0.8%.
sku = "rtx4060ti"
devices = ["NVIDIA GeForce RTX 4060 Ti"]
inherit = "rtx4080super"

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 8.4251 8.8192 8.4693 8.2688 8.6655 8.6622 median 8.5657
# HB3 8.1706 8.1062 8.1045 8.1461 8.1476 8.1452 median 8.1457
# HB6 8.2422 8.2125 8.2579 8.2541 8.2561 8.2620 median 8.2551
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 3

