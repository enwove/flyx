# Tuning table for NVIDIA L40S, written by `cuda_bench tune Qwen3.8-27B-UD-IQ3_XXS.gguf`.
# GB/s of weights streamed in brackets.
# 2026-11-19, Modal L40S 48 GB, driver 620.70.06, power limit 350 W, max SM clock 2520 MHz;
# flyx 1afc533 with the e4m3 query on binary16. The A/B against the RTX 4080 SUPER's table, which these cards
# took as their architecture's
sku = "l40s"
devices = ["NVIDIA L40S"]

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 3.4839 3.4830 3.4832 3.4830 3.4836 3.4834 median 3.4833
# HB3 3.2045 3.2047 3.2047 3.2049 3.2043 3.2047 median 3.2047
# HB6 2.9151 2.9151 2.9153 2.9149 2.9149 2.9149 median 2.9150
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 6

