# Tuning table for NVIDIA GeForce RTX 4090, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-14, RTX 4090 24 GB, driver 610.57.04, power limit 450 W: the round rules (blocks_round), kept; prefill
# inherited from rtx4080super (+7-9% faster on Qwen3.8-27B).
# 2026-11-26, RTX 4090 24 GB (vast.ai, power limit 475 W), driver 615.71.09, CUDA 13.0.88, flyx 5fae786,
# `cuda_bench tune` (every family, no file): the [[gemm]] shapes, [[flash_gqa]] and the families bf16, nvfp4,
# bf16_rows, bf16_draft, blocks and moe_gate_up, measured on this GPU instead of the RTX 4080 SUPER's or the
# defaults.  The tuner's rounds and 8-bit passes were no faster than these on the real models (within 0.5%, or
# 1-3% slower on long prompts) and are not used.  Against the table before (`flyx bench --prompts`, --ctx 4096
# --kv-method exact, in turns; the same tokens in every run): Qwen3.8-27B-UD-IQ3_XXS plain -0.3%, MTP +0.3%, 6K
# prefill +0.7% time; Qwen3.5-4B-Q4_K_M plain +0.6%; Inkling-2-Mini-UD-IQ3_XXS plain +0.2%, with DSpark -0.5%
# (its runs spread 179-184 tok/s).
sku = "rtx4090"
devices = ["NVIDIA GeForce RTX 4090"]
inherit = "rtx4080super"

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 3.7356 3.7667 3.7642 3.7698 3.7702 3.7650 median 3.7659
# HB3 3.3821 3.4137 3.4142 3.4114 3.4111 3.4140 median 3.4125
# HB6 4.5379 4.5371 4.4569 4.5375 4.5357 4.5388 median 4.5373
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 3

