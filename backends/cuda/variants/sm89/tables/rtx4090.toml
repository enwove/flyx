# This GPU's rules: for shapes no [[gemm]] lists, and the GGML block kernels' on Qwen3.8-27B's and Qwen3.5-4B's layers, every block type.
[rules]
bf16 = [
  { rows = [1, 1], nt = 1, warps = 16, unroll = 16 },
  { rows = [2, 4], nt = 1, warps = 16, unroll = 8 },
  { rows = [5, 8], nt = 1, warps = 16, unroll = 4 },
  { rows = [9, 16], nt = 2, warps = 16, unroll = 4 },
]
nvfp4_k128 = { span = 128, chunks = 8, nt = 1, warps = 8, unroll = 4 }
nvfp4_k64 = { span = 64, chunks = 16, nt = 1, warps = 16, unroll = 4 }
bf16_rows = [
  { rows = [17, 32], nt = 2, chunks = 16, unroll = 4, parts = 3 },
  { rows = [33, 48], nt = 4, chunks = 16, unroll = 2, parts = 3 },
  { rows = [49, 64], nt = 2, chunks = 16, unroll = 4, parts = 3 },
]
bf16_draft = [
  { rows = [17, 32], nt = 1, unroll = 4 },
  { rows = [33, 64], nt = 2, unroll = 4 },
]
# MoE layers' fused gate|up GEMMs on Inkling-2-Mini's experts, every type that compiles moe_dp4a configurations
moe_gate_up = [
  { types = ["Q4_K"], rows = [1, 6], columns = 0, units = 0 },
  { types = ["Q4_K"], columns = 2, units = 1 },
  { types = ["IQ2_XXS", "IQ4_NL"], rows = [1, 2], columns = 1, units = 1 },
  { types = ["IQ2_XXS", "IQ4_NL"], columns = 0, units = 0 },
  { types = ["IQ2_XS"], columns = 1, units = 1 },
  { types = ["IQ2_S"], rows = [1, 1], columns = 0, units = 0 },
  { types = ["IQ2_S"], rows = [2, 8], columns = 1, units = 1 },
  { types = ["IQ2_S"], columns = 0, units = 0 },
  { types = ["IQ3_XXS"], rows = [1, 1], columns = 0, units = 0 },
  { types = ["IQ3_XXS"], rows = [2, 2], columns = 1, units = 1 },
  { types = ["IQ3_XXS"], columns = 0, units = 0 },
  { columns = 0, units = 0 },
]
