# Tuning table for NVIDIA L4, written by `cuda_bench tune Qwen3.8-27B-UD-IQ3_XXS.gguf`.
# GB/s of weights streamed in brackets.
# 2026-11-19, Modal L4 24 GB (23 GB visible), driver 610.57.04, power limit 72 W, max SM clock 2040 MHz;
# flyx 1afc533 with the e4m3 query on binary16. The A/B against the RTX 4080 SUPER's table, which these cards
# took as their architecture's
sku = "l4"
devices = ["NVIDIA L4"]

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 9.8542 11.0035 10.4692 11.0582 10.9969 10.5492 median 10.7731
# HB3 9.5670 9.8570 10.0377 9.7980 10.0946 9.8599 median 9.8585
# HB6 8.1357 8.5291 8.5418 8.4572 8.7822 8.1895 median 8.4932
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 6

