# Tuning table for NVIDIA GeForce RTX 4070 Ti SUPER, written by `cuda_bench tune` (GB/s of weights streamed in brackets).
# 2026-11-26, RTX 4070 Ti SUPER 16 GB (vast.ai, power limit 250 W), driver 580.126.09, CUDA 13.0.88, flyx 5fae786,
# `cuda_bench tune` (every family, no file), on the RTX 4080 SUPER's table (the same AD103 chip; the sm_89 table it
# ran before): the families the A/B below does not reach.  Rounds and 8-bit passes stay the 4080 SUPER's: this
# GPU's own were no faster on decoding, and their runs of K and tiles traded 27B against 4B prefill or cost MTP
# decoding 1-3%.  Against the RTX 4080 SUPER table (`flyx bench --prompts`, --ctx 4096 --kv-method exact, in turns;
# the same tokens in every run): Qwen3.8-27B-UD-IQ3_XXS plain +0.0%, MTP -0.6%, prefill unchanged;
# Qwen3.5-4B-Q4_K_M plain +0.0%; Inkling-2-Mini-UD-IQ3_XXS plain +0.0%, with DSpark +1.4% (moe_gate_up).
sku = "rtx4070tisuper"
devices = ["NVIDIA GeForce RTX 4070 Ti SUPER"]
inherit = "rtx4080super"

# FP8 GQA, one full middle window; six orders, five timed launches per sample (ms).
# HB2 4.7585 4.7503 4.5052 4.5138 4.5179 4.5185 median 4.5182
# HB3 4.3725 4.3690 4.2074 4.1458 4.1567 4.1572 median 4.1823
# HB6 4.4376 4.4425 4.2095 4.2084 4.2233 4.2214 median 4.2223
[[flash_gqa]]
fp8 = true
nh = 24
nkv = 4
hd = 256
rows = 256
keys = 32832
hb = 3

